<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="WaterWorld">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f9dbe"/>
      <stop offset="0.62" stop-color="#a9cfdd"/>
      <stop offset="1" stop-color="#d8e9ed"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b93a8"/>
      <stop offset="0.45" stop-color="#17708c"/>
      <stop offset="1" stop-color="#07344a"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f0e8d6"/>
      <stop offset="1" stop-color="#bfb298"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Sun low over an open horizon -->
  <circle cx="398" cy="118" r="96" fill="#ffffff" opacity="0.13"/>
  <circle cx="398" cy="118" r="44" fill="#fff4d8" opacity="0.62"/>

  <g transform="translate(256 250) scale(0.74) translate(-256 -250)"><!-- The Wanderer. A mast raked hard over, snapped at the head, with the
       yard still across it and a rag of sail hanging by gravity. -->
  <g>
    <!-- One shroud still made off under the water. Two of them turn the whole
         thing into a tripod and the silhouette stops reading as a wreck. -->
    <path d="M262 196 L386 372" stroke="#2b3b46" stroke-width="4" opacity="0.55" fill="none"/>

    <!-- sail -->
    <path d="M178 196 L300 162 L306 286 L290 302 L276 272 L258 298 L240 268 L222 294 L204 266 L186 290 Z" fill="url(#canvas)"/>
    <path d="M178 196 L300 162 L302 200 L180 234 Z" fill="#cfc3a7" opacity="0.55"/>

    <!-- mast -->
    <path d="M352 430 L195 75 L182 81 L324 442 Z" fill="#22303a"/>
    <!-- splintered head -->
    <path d="M188 78 L178 42 L196 74 Z" fill="#22303a"/>
    <path d="M192 76 L207 46 L204 78 Z" fill="#22303a"/>

    <!-- yard -->
    <path d="M152 207 L332 157 L328 143 L148 193 Z" fill="#2c3b45"/>
  </g>

  </g><!-- Sea: a hard horizon, then swell that still reads at 16 px -->
  <path d="M0 330 H512 V512 H0 Z" fill="url(#sea)"/>
  <path d="M0 330 C 84 317, 140 346, 220 332 C 300 318, 356 346, 436 332 C 470 326, 494 330, 512 334 L512 352 H0 Z" fill="#2f9ab0"/>
  <path d="M0 378 C 70 364, 128 392, 206 378 C 288 363, 344 392, 424 378 C 462 371, 490 376, 512 381 L512 408 H0 Z" fill="#1c7b96" opacity="0.95"/>
  <path d="M0 434 C 78 418, 146 450, 232 434 C 314 419, 372 450, 452 435 C 476 430, 496 432, 512 436 L512 470 H0 Z" fill="#11597a"/>
  <path d="M0 482 C 96 464, 166 496, 258 482 C 344 468, 404 498, 480 484 C 492 482, 504 482, 512 484 L512 512 H0 Z" fill="#093f5c"/>

  <!-- Foam catching the light -->
  <path d="M56 372 C 100 364, 126 380, 172 374" stroke="#cfeff5" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.72"/>
  <path d="M312 430 C 354 421, 382 438, 428 430" stroke="#cfeff5" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.66"/>
</svg>
