<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="WaterWorld">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6f8c"/>
      <stop offset="0.55" stop-color="#6fa3b8"/>
      <stop offset="1" stop-color="#b7d4de"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8aa3"/>
      <stop offset="0.42" stop-color="#146f8a"/>
      <stop offset="1" stop-color="#062f44"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f3ead6"/>
      <stop offset="1" stop-color="#c4b497"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6de" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#fff6de" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff6de" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Open sky over the wreck -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Low sun / late light — one bright disc that still reads at 48 px -->
  <circle cx="392" cy="122" r="108" fill="url(#sunGlow)"/>
  <circle cx="392" cy="122" r="48" fill="#fff1c9"/>

  <!-- The Wanderer: raked mast, yard, and a rag of sail. Shapes stay thick
       enough that the silhouette still reads as a wreck on a phone home screen. -->
  <g>
    <!-- Single remaining shroud — one line only, so it never reads as a tripod -->
    <path d="M268 210 L392 378" stroke="#1a2832" stroke-width="7" stroke-linecap="round" opacity="0.5" fill="none"/>

    <!-- Torn sail hanging under gravity from the yard -->
    <path d="M168 198 L312 158 L318 292 L298 312 L280 278 L258 308 L238 274 L216 304 L196 270 L174 296 Z" fill="url(#canvas)"/>
    <path d="M168 198 L312 158 L314 206 L170 246 Z" fill="#d9cdb0" opacity="0.45"/>

    <!-- Mast — thick, dark, splintered at the head -->
    <path d="M348 438 L198 68 L178 76 L318 452 Z" fill="#1a2832"/>
    <path d="M192 74 L178 28 L208 70 Z" fill="#1a2832"/>
    <path d="M198 72 L222 34 L216 76 Z" fill="#243440"/>

    <!-- Yard across the mast -->
    <path d="M140 212 L340 156 L334 136 L134 192 Z" fill="#243440"/>
  </g>

  <!-- Sea: hard horizon, then layered swell that holds at small sizes -->
  <path d="M0 318 H512 V512 H0 Z" fill="url(#sea)"/>
  <path d="M0 318 C 88 300, 148 338, 232 318 C 316 298, 372 336, 452 318 C 478 312, 498 316, 512 320 L512 348 H0 Z" fill="#2aa0b6"/>
  <path d="M0 372 C 76 352, 136 390, 220 370 C 304 350, 360 388, 444 370 C 470 364, 494 368, 512 372 L512 410 H0 Z" fill="#17708c"/>
  <path d="M0 430 C 84 408, 152 448, 246 428 C 332 410, 392 448, 472 430 C 490 426, 504 428, 512 430 L512 472 H0 Z" fill="#0d5470"/>
  <path d="M0 478 C 100 456, 172 498, 268 478 C 356 460, 416 500, 488 482 C 500 480, 508 480, 512 482 L512 512 H0 Z" fill="#062f44"/>

  <!-- Foam catching the light — short strokes that survive downscaling -->
  <path d="M48 364 C 96 352, 130 372, 178 360" stroke="#d7f3f8" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M300 424 C 348 412, 382 432, 434 420" stroke="#d7f3f8" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.68"/>
</svg>
